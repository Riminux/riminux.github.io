<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.addEventListener('visibilitychange', function () {
    document.documentElement.classList.toggle('tab-hidden', document.hidden);
  });

  var boot = document.getElementById('bootScreen');
  if (boot) {
    if (reduce || sessionStorage.getItem('riminux_boot_seen')) {
      boot.remove();
    } else {
      var linesEl = document.getElementById('bootLines');
      var lines = [];
      try { lines = JSON.parse(boot.dataset.lines || '[]'); } catch (e) { lines = []; }
      var li = 0;
      var finished = false;
      function nextLine() {
        if (li >= lines.length) { finish(); return; }
        var p = document.createElement('div');
        p.textContent = lines[li++];
        linesEl.appendChild(p);
        setTimeout(nextLine, 240);
      }
      function finish() {
        if (finished) return;
        finished = true;
        sessionStorage.setItem('riminux_boot_seen', '1');
        setTimeout(function () {
          boot.classList.add('done');
          setTimeout(function () { boot.remove(); }, 600);
        }, 220);
      }
      if (lines.length) { nextLine(); } else { finish(); }
      window.addEventListener('keydown', finish, { once: true });
      boot.addEventListener('click', finish);
    }
  }

  var navbar = document.getElementById('navbar');
  var navToggle = document.getElementById('navToggle');
  var navLinksEl = document.getElementById('navLinks');
  if (navToggle && navLinksEl) {
    navToggle.addEventListener('click', function () {
      var open = navLinksEl.classList.toggle('open');
      navToggle.classList.toggle('open', open);
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    navLinksEl.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () {
        navLinksEl.classList.remove('open');
        navToggle.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  var navAnchors = document.querySelectorAll('.nav-links a');
  var spySections = document.querySelectorAll('section[id]');
  var spyObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var id = en.target.id;
      navAnchors.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
      });
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  spySections.forEach(function (s) { spyObs.observe(s); });

  var bar = document.querySelector('.scroll-bar');
  var scrollTicking = false;
  function updateScrollUI() {
    var el = document.documentElement;
    var max = el.scrollHeight - el.clientHeight;
    var p = max > 0 ? el.scrollTop / max : 0;
    if (bar) bar.style.transform = 'scaleX(' + p + ')';
    if (navbar) navbar.classList.toggle('scrolled', el.scrollTop > 20);
    scrollTicking = false;
  }
  document.addEventListener('scroll', function () {
    if (!scrollTicking) { scrollTicking = true; requestAnimationFrame(updateScrollUI); }
  }, { passive: true });
  updateScrollUI();

  if (!reduce && window.matchMedia('(pointer:fine)').matches) {
    var root = document.documentElement;
    var px = '50%', py = '20%', moveTicking = false;
    window.addEventListener('pointermove', function (e) {
      px = e.clientX + 'px';
      py = e.clientY + 'px';
      if (!moveTicking) {
        moveTicking = true;
        requestAnimationFrame(function () {
          root.style.setProperty('--mx', px);
          root.style.setProperty('--my', py);
          moveTicking = false;
        });
      }
    }, { passive: true });
  }

  document.querySelectorAll('[data-stagger]').forEach(function (group) {
    group.querySelectorAll('.reveal').forEach(function (el, i) {
      el.style.transitionDelay = (i * 70) + 'ms';
    });
  });
  var revealObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); revealObs.unobserve(en.target); }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
  document.querySelectorAll('.reveal').forEach(function (el) { revealObs.observe(el); });

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function countUp(el) {
    var target = parseFloat(el.dataset.target), dur = 1500, start = null;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      el.textContent = Math.floor(easeOut(p) * target).toLocaleString();
      if (p < 1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
    }
    requestAnimationFrame(step);
  }
  var numObs = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      if (reduce) en.target.textContent = (+en.target.dataset.target).toLocaleString();
      else countUp(en.target);
      numObs.unobserve(en.target);
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('[data-target]').forEach(function (el) { numObs.observe(el); });

  var y = document.querySelector('.year');
  if (y) y.textContent = new Date().getFullYear();
})();
</script>
